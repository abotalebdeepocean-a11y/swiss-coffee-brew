[build]
  base = "/"
  command = "npm install --include=dev --no-audit --no-fund && npm run build"
  publish = "dist"

# Client-side routing (react-router BrowserRouter) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep pull-request/deploy previews isolated from the live Supabase project.
[context.deploy-preview.environment]
  VITE_APP_ENV = "experimental"
